# Deploys docs/ to GitHub Pages and bakes in a snapshot of the public data from Google Apps Script,
# so first-time visitors don't wait 1–10 s for Apps Script to wake up. Runs on every push and every
# 10 minutes; scheduled runs only redeploy when the data actually changed.
name: Deploy site + data snapshot

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.snap.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot public data from Apps Script
        id: snap
        env:
          LIVE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/snapshot.json
        run: |
          mkdir -p docs/data
          API=$(grep -oE "https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec" docs/assets/js/config.js | head -1 || true)
          changed=true
          echo "Apps Script URL found: $([ -n "$API" ] && echo yes || echo no)"
          code=000
          for i in 1 2 3 4; do
            code=$(curl -sL --max-time 90 -A "Mozilla/5.0 (rattana-help snapshot)" -o raw.json -w '%{http_code}' "$API?action=data" || echo 000)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && grep -q '"ok":true' raw.json && break
            head -c 200 raw.json 2>/dev/null | tr '\n' ' '; echo
            sleep $((i * 8))
          done
          if [ -n "$API" ] && [ "$code" = "200" ] \
             && node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('raw.json','utf8'));if(!j.ok)process.exit(1);delete j.data.generated_at;fs.writeFileSync('docs/data/snapshot.json',JSON.stringify(j.data));"; then
            echo "Snapshot: $(wc -c < docs/data/snapshot.json) bytes"
            if curl -sfL "$LIVE" -o live.json && cmp -s live.json docs/data/snapshot.json; then changed=false; fi
          else
            echo "::warning::Apps Script did not answer — keeping the snapshot that is live now"
            curl -sfL "$LIVE" -o docs/data/snapshot.json || rm -f docs/data/snapshot.json
            changed=false
          fi
          if [ "${{ github.event_name }}" != "schedule" ]; then changed=true; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - if: steps.snap.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - if: steps.snap.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
